<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fortune's Gambit duel server</title>
<meta name="robots" content="noindex">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#110f19;color:#f2eddf;font-family:system-ui,sans-serif}
  main{max-width:420px;padding:28px 30px;border:2px solid #b8955a;background:#16121c;text-align:center}
  h1{font-family:Georgia,serif;font-size:24px;font-weight:600;margin:0 0 10px}
  p{color:#c9bfcb;line-height:1.6;margin:0 0 16px}
  a{display:inline-block;padding:11px 20px;border:2px solid #d9b066;color:#f6dca2;text-decoration:none;font-weight:700}
  a:hover{background:#2a2218}
</style>
</head>
<body>
<main>
  <h1>Fortune's Gambit</h1>
  <p id="msg">This is the duel server. Duels are played in the game itself. Taking you there…</p>
  <a id="go" href="https://martinsnelling.com/gambit/">Open Fortune's Gambit</a>
</main>
<script>
  // The old 2D test page has retired. Anyone who lands here (for example from an old invite
  // link like ?room=ABCDE or ?duel=ABCDE) is sent to the real game, keeping the duel code.
  const q = new URLSearchParams(location.search);
  const code = (q.get('duel') || q.get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
  const url = 'https://martinsnelling.com/gambit/' + (code ? '?duel=' + encodeURIComponent(code) : '');
  document.getElementById('go').href = url;
  if (code) document.getElementById('msg').textContent = `Taking you to duel ${code} in the game…`;
  setTimeout(() => location.replace(url), 1200);
</script>
</body>
</html>
